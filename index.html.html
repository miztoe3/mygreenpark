:root[data-theme="dark"]{--bg:#111a14;--card:#1a271e;--ink:#e8f0e4;--sub:#9db0a3;--g:#7fcf9c;--g2:#233a2b;--line:#2e4335;--warn:#ff8a70}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.6;font-size:16px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{max-width:1000px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.logo{font-family:'Jua';font-size:24px;color:var(--g);cursor:pointer;margin-right:auto}
nav{display:flex;gap:4px;overflow-x:auto;max-width:100%}
nav button{border:0;background:none;color:var(--sub);font:inherit;padding:8px 12px;border-radius:20px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--g);color:var(--bg);}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pt);outline-offset:2px}
main{max-width:1000px;margin:auto;padding:20px 16px 60px}
.hero{background:var(--g);color:#f2f7ee;border-radius:28px 28px 28px 4px;padding:28px 24px;margin-bottom:28px}
:root[data-theme="dark"] .hero,.hero{color:#f2f7ee}
.hero h1{font-size:30px}.hero p{max-width:34ch;opacity:.9}
section{margin:30px 0}section>h2{font-size:22px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card.tap{cursor:pointer}
.em{font-size:38px;line-height:1}
.pill{display:inline-block;font-size:13px;padding:1px 10px;border-radius:12px;background:var(--g2);color:var(--g);margin:2px 4px 2px 0}
.pill.w{background:#fbe3c8;color:#8a4b12}
.btn{border:0;background:var(--g);color:var(--bg);font:inherit;padding:8px 16px;border-radius:20px;cursor:pointer}
.btn.o{background:none;border:1px solid var(--g);color:var(--g)}
.btn.s{padding:4px 12px;font-size:14px}
.sub{color:var(--sub);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
textarea{width:100%}
.dots{letter-spacing:2px;color:var(--g)}
.banner{background:var(--pt);color:#3a2a00;border-radius:12px;padding:10px 14px;margin-bottom:14px}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:9;padding:0}
.modal>div{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:6px 14px;border-radius:18px;cursor:pointer;margin:0 6px 8px 0}
.chip.on{background:var(--g);color:var(--bg);border-color:var(--g)}
.bar{height:8px;background:var(--g2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer}
.tip{border-left:4px solid var(--pt);padding-left:12px}
@media(prefers-reduced-motion:no-preference){.hero{animation:in .6s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style></head><body>

<details class="card" style="margin:12px 0"><summary><b>작물 등록하기</b></summary><p class="sub">입력한 정보는 병해충 진단에 함께 쓰여요.</p><div class="row" style="align-items:flex-end">
${f('작물',`<select id="gs">${P.map(p=>`<option value="${p.id}">${p.e} ${p.n}</option>`).join('')}</select>`)}

<button class="btn" onclick="reg()">등록</button></div></details>
${S.garden.length?`<div class="grid">${S.garden.map((g,i)=>{const age=t-g.start,tot=g.hv-g.start,left=g.hv-t,nw=g.last+g.w-t;return `<div class="card"><div class="row" style="justify-content:space-between"><div><span class="em" style="font-size:30px">${g.e}</span> <b>${g.n}</b></div><button class="btn o s" onclick="rm(${i})" aria-label="삭제">삭제</button></div>

<input value="${esc(g.variety)}" placeholder="품종 입력" aria-label="품종" onchange="upd(${i},'variety',this.value)" style="width:100%">
<div class="bar" style="margin:8px 0"><i style="width:${Math.min(100,age/tot*100)}%"></i></div>
<div class="sub">파종·정식 후 ${age}일 · 수확 ${left>0?'D-'+left:'D-day'} (${ds(g.hv)})</div>
<div style="margin:6px 0">${nw<=0?'<span class="pill w">💧 물 줄 시간</span>':`<span class="pill">다음 물주기 ${nw}일 후</span>`}</div>
<div class="row"><button class="btn s" onclick="water(${i})">물 줬어요</button><button class="btn o s" onclick="S.dx=newDx();S.dx.ref='g${i}';go('diag')">이 작물 진단</button></div>
<div class="row" style="margin-top:8px"><input id="lg${i}" placeholder="오늘의 성장 기록" style="flex:1;min-width:0"><button class="btn o s" onclick="log(${i})">기록</button></div>
${g.logs.slice(-3).reverse().map(l=>`<div class="sub">${ds(l.d)} · ${esc(l.t)}</div>`).join('')}
${g.logs.length?`<button class="btn o s" style="margin-top:6px" onclick="share(${i})">커뮤니티에 공유</button>`:''}</div>`}).join('')}</div>`:'<div class="card">아직 등록한 작물이 없어요. 마켓에서 모종을 사거나 위에서 직접 등록해 보세요.</div>'}`}

function ctx(){const d=S.dx;if(!d.ref)d.ref=S.garden.length?'g0':'p1';const r=d.ref;

function rules(c){const all=S.dx.sel.flat();return DX.filter(x=>!x.crops||x.crops.includes(c.pid)).map(x=>{let m=x.k.filter(k=>all.includes(k)).length;if(x.k[0]=='주황 반점'&&all.includes('주황 반점'))m+=2;if(c.method=='화분·가정재배'&&x.n.startsWith('과습')&&m)m+=.5;return{...x,s:Math.min(1,m/3)}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,2)}

${c.g?`생육 단계: ${c.stage} / 파종·정식 후 ${c.age}일 / 품종: ${c.variety||'미입력'} / 재배 방식: ${c.method} / 재배 토양: ${c.soil}`:'재배 정보: 없음'}

${img?'사진에서 보이는 것을 우선 근거로 삼고, 선택 응답과 충돌하면 사진을 우선하세요.':'사진이 없으므로 선택 응답만으로 판단하고 confidence를 낮추세요.'} 확실하지 않으면 추측을 사실처럼 쓰지 마세요. 재배 방식·토양·생육 단계를 원인과 해결법에 반영하세요.

<section><h2 style="font-size:18px">도전과제</h2><div class="grid">${CH.map(([e,t,n],i)=>`<div class="card"><div class="em">${e}</div><b>${t}</b><div class="bar" style="margin:8px 0"><i style="width:${S.ch[i]/n*100}%"></i></div><div class="sub">${S.ch[i]}/${n}${S.ch[i]>=n?' · 달성 🎉':''}</div><div class="row" style="margin-top:6px">${S.joined[i]?`<button class="btn s" onclick="chk(${i})" ${S.ch[i]>=n?'disabled':''}>오늘 인증</button>`:`<button class="btn o s" onclick="S.joined[${i}]=true;save();render()">도전하기</button>`}</div></div>`).join('')}</div></section>
<section><h2 style="font-size:18px">재배일지 공유</h2><textarea id="pt" rows="3" placeholder="오늘 키운 이야기를 남겨 보세요"></textarea><div class="row" style="margin:8px 0"><select id="pc">${P.map(p=>`<option>${p.e}</option>`).join('')}</select><button class="btn" onclick="post()">공유하기</button></div>
${S.posts.map((p,i)=>`<div class="card" style="margin-bottom:10px"><b>${p.e} ${p.u}</b><p style="margin:6px 0">${p.t}</p><button class="btn o s" onclick="S.posts[${i}].l++;save();render()">♥ ${p.l}</button></div>`).join('')}</section>`}
function chk(i){S.ch[i]=Math.min(CH[i][2],S.ch[i]+1);save();render()}
function post(){const v=$('pt').value.trim();if(!v)return toast('내용을 입력해 주세요');S.posts.unshift({u:'나',e:$('pc').value,t:v,l:0});save();render()}
render();
</script></body></html>
